<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <meta name="description" content="A local-first task tracker with counters, repeating tasks and a review page. No account, no server, all data in your browser.">
  <meta name="theme-color" content="#f6f7f9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6bed'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.2 8.4l3.2 3.2 6.4-7"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Task Tracker</h1>
          <p id="header-sub">Loading…</p>
        </div>
      </div>

      <nav class="tabs" aria-label="Views">
        <a href="#/tasks" data-route="tasks">Tasks</a>
        <a href="#/calendar" data-route="calendar">Calendar</a>
        <a href="#/stats" data-route="stats">Review</a>
        <a href="#/archive" data-route="archive">Archive</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>

      <button type="button" class="btn btn-primary header-cta" data-action="new-task">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M8 3.5v9M3.5 8h9"/>
        </svg>
        New task
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <noscript>
    <div class="noscript">This app needs JavaScript — everything runs in your browser, nothing is sent anywhere.</div>
  </noscript>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <!-- Load order matters: these are classic scripts, not modules. -->
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/model.js"></script>
  <script src="js/recurrence.js"></script>
  <script src="js/counters.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/list.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/archive.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
